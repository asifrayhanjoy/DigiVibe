<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- YouTube Red Gradient -->
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="100%" stop-color="#D90000"/>
    </linearGradient>

    <!-- Facebook Blue Gradient -->
    <linearGradient id="fbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2188FF"/>
      <stop offset="100%" stop-color="#1266E2"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="ytGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="fbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.06">
    <path d="M0 76H600M0 152H600M0 228H600M0 304H600" stroke="#06b6d4" stroke-width="1"/>
    <path d="M120 0V380M240 0V380M360 0V380M480 0V380" stroke="#06b6d4" stroke-width="1"/>
  </g>

  <!-- Left Ambient Red Glow for YouTube -->
  <circle cx="180" cy="175" r="110" fill="#FF0000" opacity="0.22" filter="url(#ytGlow)"/>

  <!-- Right Ambient Blue Glow for Facebook -->
  <circle cx="420" cy="175" r="110" fill="#1877F2" opacity="0.22" filter="url(#fbGlow)"/>

  <!-- Center Ambient Cyan Glow -->
  <circle cx="300" cy="175" r="70" fill="#06B6D4" opacity="0.08" filter="url(#fbGlow)"/>

  <!-- LEFT: YOUTUBE SECTION -->
  <g transform="translate(110, 80)" filter="url(#shadowBox)">
    <!-- Container Glass Pod -->
    <rect width="145" height="152" rx="24" fill="url(#cardGlass)" stroke="rgba(255, 0, 0, 0.35)" stroke-width="1.5"/>
    
    <!-- YouTube Official Play Button -->
    <g transform="translate(25, 26)" filter="url(#iconShadow)">
      <!-- Red Rounded Pill/Rectangle -->
      <rect width="95" height="66" rx="20" fill="url(#ytGrad)"/>
      <!-- Inner Specular Light -->
      <path d="M20 2h55c9 0 18 6 18 16v3c0-10-9-17-18-17H20C11 4 2 11 2 21v-3C2 8 11 2 20 2z" fill="#FFFFFF" opacity="0.25"/>
      <!-- White Triangle Play -->
      <polygon points="40,20 40,46 63,33" fill="#FFFFFF"/>
    </g>

    <!-- YouTube Label -->
    <text x="72.5" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">YouTube</text>
  </g>

  <!-- CENTER: CONNECTOR PLUS / AMPERSAND -->
  <g transform="translate(280, 137)" filter="url(#iconShadow)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="20" y="26" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">&amp;</text>
  </g>

  <!-- RIGHT: FACEBOOK SECTION -->
  <g transform="translate(345, 80)" filter="url(#shadowBox)">
    <!-- Container Glass Pod -->
    <rect width="145" height="152" rx="24" fill="url(#cardGlass)" stroke="rgba(24, 119, 242, 0.35)" stroke-width="1.5"/>

    <!-- Facebook Official Logo Icon -->
    <g transform="translate(25, 26)" filter="url(#iconShadow)">
      <!-- Blue Squircle -->
      <rect width="95" height="66" rx="20" fill="url(#fbGrad)"/>
      <!-- Inner Specular Light -->
      <path d="M20 2h55c9 0 18 6 18 16v3c0-10-9-17-18-17H20C11 4 2 11 2 21v-3C2 8 11 2 20 2z" fill="#FFFFFF" opacity="0.25"/>
      <!-- Facebook 'f' Letter -->
      <path d="M57.5 66V41.5h8.2l1.2-9.6h-9.4v-6.1c0-2.8 0.8-4.7 4.8-4.7H67V12.5c-0.9-0.1-4.1-0.4-7.8-0.4-7.7 0-13 4.7-13 13.4v7.4h-8.3v9.6h8.3V66h16.3z" fill="#FFFFFF"/>
    </g>

    <!-- Facebook Label -->
    <text x="72.5" y="130" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">Facebook</text>
  </g>

  <!-- BOTTOM BADGE: Growth & Viral Guidance -->
  <g transform="translate(185, 276)">
    <rect width="230" height="34" rx="17" fill="#09101d" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.2"/>
    <!-- Pulsing Green Dot -->
    <circle cx="28" cy="17" r="4.5" fill="#10b981"/>
    <!-- Badge Text -->
    <text x="42" y="22" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1">PAGE &amp; CHANNEL GROWTH</text>
  </g>
</svg>
